# Refuses any push or pull request that adds a secret (API key, token, private
# key, password, IBAN, card number) to this public repository.
# Script: tools/secret_scan.py (standard library only).
name: Secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a commit SHA (a tag can be moved); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/secret_scan.py
